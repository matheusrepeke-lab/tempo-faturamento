<script>
(function(){
'use strict';
const ITER=600000,KEY='painelTempoChave';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>btoa(String.fromCharCode.apply(null,Array.from(u)));
const raw=b64(document.getElementById('enc').textContent.trim());
const salt=raw.slice(0,16),iv=raw.slice(16,32),ct=raw.slice(32,raw.length-32),mac=raw.slice(raw.length-32),signed=raw.slice(0,raw.length-32);
const subtle=window.crypto&&window.crypto.subtle;
async function derive(pw){
 const base=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,512));
}
async function unlock(key){
 const macKey=await subtle.importKey('raw',key.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 if(!await subtle.verify('HMAC',macKey,mac,signed))return null;
 const encKey=await subtle.importKey('raw',key.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
 const gz=await subtle.decrypt({name:'AES-CBC',iv},encKey,ct);
 const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
 return await new Response(stream).text();
