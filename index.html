<script>
(function(){
'use strict';
const ITER=600000,KEY='painelTempoChave';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>btoa(String.fromCharCode.apply(null,Array.from(u)));
const raw=b64(document.getElementById('enc').textContent.trim());
const salt=raw.slice(0,16),iv=raw.slice(16,32),ct=raw.slice(32,raw.length-32),mac=raw.slice(raw.length-32),signed=raw.slice(0,raw.length-32);
const subtle=window.crypto&&window.crypto.subtle;
async function derive(pw){
 const base=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,512));
}
async function unlock(key){
 const macKey=await subtle.importKey('raw',key.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 if(!await subtle.verify('HMAC',macKey,mac,signed))return null;
 const encKey=await subtle.importKey('raw',key.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
 const gz=await subtle.decrypt({name:'AES-CBC',iv},encKey,ct);
 const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
 return await new Response(stream).text();
}
function show(html){document.open();document.write(html);document.close()}
function fail(msg){const e=document.getElementById('err');e.textContent=msg;e.hidden=false;document.getElementById('go').disabled=false;document.getElementById('go').textContent='Abrir painel'}
if(!subtle||!window.DecompressionStream){fail('Este navegador não suporta a abertura do painel. Use Chrome, Edge ou Firefox atualizados.');document.getElementById('go').disabled=true;return}
(async()=>{try{const k=localStorage.getItem(KEY);if(k){const html=await unlock(b64(k));if(html){show(html);return}localStorage.removeItem(KEY)}}catch(e){}})();
document.getElementById('form').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const go=document.getElementById('go');go.disabled=true;go.textContent='Verificando…';document.getElementById('err').hidden=true;
 try{
  const key=await derive(document.getElementById('pw').value);
  const html=await unlock(key);
  if(!html){fail('Senha incorreta.');return}
  try{if(document.getElementById('remember').checked)localStorage.setItem(KEY,toB64(key));else localStorage.removeItem(KEY)}catch(e){}
  show(html);
 }catch(e){fail('Não foi possível abrir o painel: '+e.message)}
});
})();
</script>
